openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: circuits
    description: Circuit schematic generation
  - name: tutor
    description: Signed-in AI circuit education and review
  - name: account
    description: Per-account AI usage, memory, and key selection
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /circuits/generate:
    post:
      operationId: generateCircuit
      tags: [circuits]
      summary: Generate an editable circuit schematic
      description: Converts a natural-language circuit description into a CircuitDraw-compatible schematic specification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitPrompt"
      responses:
        "200":
          description: Generated circuit schematic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitSpec"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Circuit generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/library/search:
    get:
      operationId: searchCircuitSymbols
      tags: [circuits]
      summary: Search the KiCad schematic symbol library
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: library
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: family
          in: query
          required: false
          schema:
            type: string
            enum:
              - Passives
              - Semiconductors
              - Power & protection
              - Connectors
              - Analog & signal
              - Digital & processors
              - Sensors
              - Control & timing
              - Audio & display
              - Communications & RF
              - Other
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Matching symbols from the official KiCad library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitSymbolSearchResponse"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/library/symbol-data:
    get:
      operationId: getCircuitSymbolData
      tags: [circuits]
      summary: Get source geometry for a KiCad symbol preview
      parameters:
        - name: symbolId
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 160
            pattern: "^[^:\\s]+:[^:\\s]+$"
      responses:
        "200":
          description: Exact symbol units, pins, and drawing primitives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KicadSymbolData"
        "400":
          description: Invalid symbol ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: KiCad source geometry is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/tutor:
    post:
      operationId: askCircuitTutor
      tags: [tutor]
      summary: Ask for an explanation of a circuit or image
      description: Returns educational guidance that separates visible evidence from inference. Optional edit proposals are validated CircuitSpecs and never applied automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorRequest"
      responses:
        "200":
          description: Tutor explanation and optional edit proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorResponse"
        "400":
          description: Invalid question, image, or circuit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Uploaded image exceeds the size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/build-chat:
    post:
      operationId: chatWithCircuitBuilder
      tags: [tutor]
      summary: Clarify circuit requirements or propose a circuit edit
      description: Maintains a concise design brief and, in Build mode, may return a validated CircuitSpec proposal that the user must review and apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuildChatInput"
      responses:
        "200":
          description: Chat response, updated design brief, and optional circuit proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuildChatResponse"
        "400":
          description: Invalid chat message, brief, or circuit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The model response could not be used
          headers:
            X-Circuit-AI-Output-Invalid:
              description: Set to true when the response failed format or schema validation
              schema:
                type: string
                enum: ["true"]
            X-Circuit-AI-Retryable:
              description: Whether the client may retry this request
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is unavailable or usage could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/external-fix/review:
    post:
      operationId: reviewExternalCircuitFix
      tags: [tutor]
      summary: Review a user-pasted correction to a rejected circuit
      description: Checks a candidate CircuitSpec against a rejected proposal and its reported problems. The response is an AI review, not proof of electrical correctness or safety.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalCircuitFixReviewInput"
      responses:
        "200":
          description: AI review verdict and reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCircuitFixReviewResponse"
        "400":
          description: Invalid or unsupported candidate CircuitSpec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Review rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Studio AI could not produce a usable review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI usage could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/memories:
    get:
      operationId: listCircuitBuilderMemories
      tags: [account]
      summary: List saved Circuit Studio assumptions
      responses:
        "200":
          description: Saved assumptions for the signed-in user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircuitBuilderMemory"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearCircuitBuilderMemories
      tags: [account]
      summary: Delete all saved Circuit Studio assumptions
      responses:
        "204":
          description: All saved assumptions were deleted
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/memories/import:
    post:
      operationId: learnFromCircuitBuilderHistory
      tags: [account]
      summary: Learn reusable assumptions from saved chats
      description: Analyzes short summaries of recent local conversations and stores only reusable assumptions, not transcripts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuilderHistoryImportInput"
      responses:
        "200":
          description: Reusable assumptions extracted from the submitted history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuilderHistoryImportResponse"
        "400":
          description: Invalid history summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The AI could not summarize the saved chats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI usage could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/memories/repair-lessons:
    post:
      operationId: saveCircuitBuilderRepairLesson
      tags: [account]
      summary: Save a lesson from a corrected circuit
      description: Stores a repair lesson after a corrected proposal passes checks and the user applies it, or learns from a manual correction after it passes checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuilderRepairLessonInput"
      responses:
        "200":
          description: Repair lesson saved, already known, or not generalizable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuilderRepairLessonResult"
        "400":
          description: Invalid repair lesson or circuit evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Repair lesson generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: A reusable repair lesson could not be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Repair lesson could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/history:
    get:
      operationId: listCircuitBuilderHistory
      tags: [account]
      summary: List saved Circuit Studio conversations
      description: Returns the signed-in user's complete chat and build history.
      responses:
        "200":
          description: Saved conversations and circuit snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircuitBuilderHistorySession"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: syncCircuitBuilderHistory
      tags: [account]
      summary: Save Circuit Studio conversations
      description: Saves or updates account-owned sessions, including unfinished chats and circuit snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuilderHistorySyncInput"
      responses:
        "200":
          description: Number of saved conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuilderHistorySyncResponse"
        "400":
          description: Invalid conversation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/history/deletions:
    get:
      operationId: listDeletedCircuitBuilderHistory
      tags: [account]
      summary: List deleted Circuit Studio conversations
      description: Returns account-owned conversation deletion markers so older device copies cannot restore deleted sessions.
      responses:
        "200":
          description: Deleted conversation identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircuitBuilderHistoryDeletion"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/history/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    delete:
      operationId: deleteCircuitBuilderHistory
      tags: [account]
      summary: Delete a saved Circuit Studio conversation
      description: Deletes one conversation owned by the signed-in user.
      responses:
        "204":
          description: Conversation deleted, or no matching conversation exists
        "400":
          description: Invalid conversation identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/memories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateCircuitBuilderMemory
      tags: [account]
      summary: Edit a saved Circuit Studio assumption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuilderMemoryInput"
      responses:
        "200":
          description: Updated saved assumption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuilderMemory"
        "400":
          description: Invalid assumption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Assumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCircuitBuilderMemory
      tags: [account]
      summary: Delete a saved Circuit Studio assumption
      responses:
        "204":
          description: Assumption was deleted
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Assumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/review:
    post:
      operationId: reviewCircuit
      tags: [tutor]
      summary: Review a valid circuit draft
      description: Returns a concise educational review of a structurally valid draft. It does not check electrical safety or correctness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitReviewRequest"
      responses:
        "200":
          description: Review of the submitted draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitReviewResponse"
        "400":
          description: Invalid circuit draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/usage:
    get:
      operationId: getAiUsage
      tags: [account]
      summary: Read the signed-in account's AI usage and selected key
      responses:
        "200":
          description: Tracked usage and configured key numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsage"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [account]
      summary: Check Gemini model availability without generating content
      responses:
        "200":
          description: Provider responsiveness and account availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI status could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/key-selection:
    put:
      operationId: setAiKeySelection
      tags: [account]
      summary: Select a configured Gemini key for this account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiKeySelectionRequest"
      responses:
        "200":
          description: Updated account usage and selected key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsage"
        "400":
          description: The requested key number is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CircuitPrompt:
      type: object
      properties:
        prompt:
          type: string
          minLength: 8
          maxLength: 3000
      required:
        - prompt
    TutorImage:
      type: object
      properties:
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        dataBase64:
          type: string
          maxLength: 5592408
          description: Base64-encoded image bytes, without a data URL prefix. Maximum decoded size is 4 MiB.
      required: [mimeType, dataBase64]
      additionalProperties: false
    TutorRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 3000
        image:
          $ref: "#/components/schemas/TutorImage"
        currentSpec:
          $ref: "#/components/schemas/CircuitSpec"
        proposeEdits:
          type: boolean
          default: false
      additionalProperties: false
    TutorProposedEdit:
      type: object
      properties:
        summary:
          type: string
        spec:
          $ref: "#/components/schemas/CircuitSpec"
      required: [summary, spec]
      additionalProperties: false
    TutorResponse:
      type: object
      properties:
        answer:
          type: string
        observed:
          type: array
          items: { type: string }
        inferred:
          type: array
          items: { type: string }
        unknowns:
          type: array
          items: { type: string }
        missingValues:
          type: array
          items: { type: string }
        proposedEdit:
          $ref: "#/components/schemas/TutorProposedEdit"
      required: [answer, observed, inferred, unknowns, missingValues]
      additionalProperties: false
    CircuitBuildChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 3000
      required: [role, content]
      additionalProperties: false
    CircuitDesignBrief:
      type: object
      properties:
        goal:
          type: string
          maxLength: 1000
        requirements:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 300
        assumptions:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 300
        openQuestions:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 300
      required: [goal, requirements, assumptions, openQuestions]
      additionalProperties: false
    CircuitBuildChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 6000
        mode:
          type: string
          enum: [chat, build]
        responseFormatRetry:
          type: boolean
          description: Indicates a retry for correcting a previously truncated or malformed model response.
        currentSpec:
          $ref: "#/components/schemas/CircuitSpec"
        history:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/CircuitBuildChatMessage"
        brief:
          $ref: "#/components/schemas/CircuitDesignBrief"
      required: [message, mode, currentSpec]
      additionalProperties: false
    CircuitBuildProposal:
      type: object
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 500
        spec:
          $ref: "#/components/schemas/CircuitSpec"
      required: [summary, spec]
      additionalProperties: false
    CircuitBuilderSuggestedAction:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 90
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
        replyTo:
          type: string
          minLength: 1
          maxLength: 300
          description: Exact assistant question this suggested reply answers.
      required: [label, prompt]
      additionalProperties: false
    CircuitBuildChatResponse:
      type: object
      properties:
        nextMode:
          type: string
          enum: [chat, build]
        answer:
          type: string
          minLength: 1
          maxLength: 3000
        brief:
          $ref: "#/components/schemas/CircuitDesignBrief"
        proposal:
          $ref: "#/components/schemas/CircuitBuildProposal"
        suggestedActions:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/CircuitBuilderSuggestedAction"
        memoryUpdates:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/CircuitBuilderMemorySuggestion"
        memoryRemovals:
          type: array
          maxItems: 10
          items:
            type: integer
            minimum: 1
        repairLesson:
          type: ["string", "null"]
          maxLength: 300
          description: Optional reusable lesson from a repair; save only after the corrected proposal passes checks and the user applies it.
        buildApprovalRequested:
          type: boolean
          description: Server-set marker that the assistant asked permission before creating a schematic.
      required: [answer, brief]
      additionalProperties: false
    CircuitBuilderMemoryCategory:
      type: string
      enum: [work-style, design-decision, past-context, repair-lesson]
    CircuitBuilderMemory:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        category:
          $ref: "#/components/schemas/CircuitBuilderMemoryCategory"
        content:
          type: string
          minLength: 1
          maxLength: 300
        updatedAt:
          type: string
          format: date-time
      required: [id, category, content, updatedAt]
      additionalProperties: false
    CircuitBuilderMemoryInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 300
      required: [content]
      additionalProperties: false
    CircuitBuilderMemorySuggestion:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          description: Existing assumption to update; omit when adding a new one.
        category:
          $ref: "#/components/schemas/CircuitBuilderMemoryCategory"
        content:
          type: string
          minLength: 1
          maxLength: 300
      required: [category, content]
      additionalProperties: false
    CircuitBuilderHistoryExcerpt:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        context:
          type: string
          minLength: 1
          maxLength: 3000
      required: [title, context]
      additionalProperties: false
    CircuitBuilderHistoryImportInput:
      type: object
      properties:
        conversations:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/CircuitBuilderHistoryExcerpt"
      required: [conversations]
      additionalProperties: false
    CircuitBuilderMemoryLearningModelResponse:
      type: object
      properties:
        memoryUpdates:
          type: array
          maxItems: 12
          items:
