openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: circuits
    description: Circuit schematic generation
  - name: tutor
    description: Signed-in AI circuit education and review
  - name: account
    description: Per-account AI usage and key selection
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /circuits/generate:
    post:
      operationId: generateCircuit
      tags: [circuits]
      summary: Generate an editable circuit schematic
      description: Converts a natural-language circuit description into a CircuitDraw-compatible schematic specification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitPrompt"
      responses:
        "200":
          description: Generated circuit schematic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitSpec"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Circuit generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/library/search:
    get:
      operationId: searchCircuitSymbols
      tags: [circuits]
      summary: Search the KiCad schematic symbol library
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: library
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 40
      responses:
        "200":
          description: Matching symbols from the official KiCad library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitSymbolSearchResponse"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/tutor:
    post:
      operationId: askCircuitTutor
      tags: [tutor]
      summary: Ask for an explanation of a circuit or image
      description: Returns educational guidance that separates visible evidence from inference. Optional edit proposals are validated CircuitSpecs and never applied automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorRequest"
      responses:
        "200":
          description: Tutor explanation and optional edit proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorResponse"
        "400":
          description: Invalid question, image, or circuit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Uploaded image exceeds the size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/build-chat:
    post:
      operationId: chatWithCircuitBuilder
      tags: [tutor]
      summary: Clarify circuit requirements or propose a circuit edit
      description: Maintains a concise design brief and, in Build mode, may return a validated CircuitSpec proposal that the user must review and apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuildChatInput"
      responses:
        "200":
          description: Chat response, updated design brief, and optional circuit proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuildChatResponse"
        "400":
          description: Invalid chat message, brief, or circuit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The model response could not be used
          headers:
            X-Circuit-AI-Output-Invalid:
              description: Set to true when the response failed format or schema validation
              schema:
                type: string
                enum: ["true"]
            X-Circuit-AI-Retryable:
              description: Whether the client may retry this request
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is unavailable or usage could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/review:
    post:
      operationId: reviewCircuit
      tags: [tutor]
      summary: Review a valid circuit draft
      description: Returns a concise educational review of a structurally valid draft. It does not check electrical safety or correctness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitReviewRequest"
      responses:
        "200":
          description: Review of the submitted draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitReviewResponse"
        "400":
          description: Invalid circuit draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/usage:
    get:
      operationId: getAiUsage
      tags: [account]
      summary: Read the signed-in account's AI usage and selected key
      responses:
        "200":
          description: Tracked usage and configured key numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsage"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [account]
      summary: Check Gemini model availability without generating content
      responses:
        "200":
          description: Provider responsiveness and account availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI status could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/key-selection:
    put:
      operationId: setAiKeySelection
      tags: [account]
      summary: Select a configured Gemini key for this account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiKeySelectionRequest"
      responses:
        "200":
          description: Updated account usage and selected key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsage"
        "400":
          description: The requested key number is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CircuitPrompt:
      type: object
      properties:
        prompt:
          type: string
          minLength: 8
          maxLength: 3000
      required:
        - prompt
    TutorImage:
      type: object
      properties:
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        dataBase64:
          type: string
          maxLength: 5592408
          description: Base64-encoded image bytes, without a data URL prefix. Maximum decoded size is 4 MiB.
      required: [mimeType, dataBase64]
      additionalProperties: false
    TutorRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 3000
        image:
          $ref: "#/components/schemas/TutorImage"
        currentSpec:
          $ref: "#/components/schemas/CircuitSpec"
        proposeEdits:
          type: boolean
          default: false
      additionalProperties: false
    TutorProposedEdit:
      type: object
      properties:
        summary:
          type: string
        spec:
          $ref: "#/components/schemas/CircuitSpec"
      required: [summary, spec]
      additionalProperties: false
    TutorResponse:
      type: object
      properties:
        answer:
          type: string
        observed:
          type: array
          items: { type: string }
        inferred:
          type: array
          items: { type: string }
        unknowns:
          type: array
          items: { type: string }
        missingValues:
          type: array
          items: { type: string }
        proposedEdit:
          $ref: "#/components/schemas/TutorProposedEdit"
      required: [answer, observed, inferred, unknowns, missingValues]
      additionalProperties: false
    CircuitBuildChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 3000
      required: [role, content]
      additionalProperties: false
    CircuitDesignBrief:
      type: object
      properties:
        goal:
          type: string
          maxLength: 1000
        requirements:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 300
        assumptions:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 300
        openQuestions:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 300
      required: [goal, requirements, assumptions, openQuestions]
      additionalProperties: false
    CircuitBuildChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 6000
        mode:
          type: string
          enum: [chat, build]
        responseFormatRetry:
          type: boolean
          description: Indicates a retry for correcting a previously truncated or malformed model response.
        currentSpec:
          $ref: "#/components/schemas/CircuitSpec"
        history:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/CircuitBuildChatMessage"
        brief:
          $ref: "#/components/schemas/CircuitDesignBrief"
      required: [message, mode, currentSpec]
      additionalProperties: false
    CircuitBuildProposal:
      type: object
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 500
        spec:
          $ref: "#/components/schemas/CircuitSpec"
      required: [summary, spec]
      additionalProperties: false
    CircuitBuilderSuggestedAction:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 90
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
      required: [label, prompt]
      additionalProperties: false
    CircuitBuildChatResponse:
      type: object
      properties:
        nextMode:
          type: string
          enum: [chat, build]
        answer:
          type: string
          minLength: 1
          maxLength: 3000
        brief:
          $ref: "#/components/schemas/CircuitDesignBrief"
        proposal:
          $ref: "#/components/schemas/CircuitBuildProposal"
        suggestedActions:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/CircuitBuilderSuggestedAction"
      required: [answer, brief]
      additionalProperties: false
    CircuitSymbolSearchItem:
      type: object
      properties:
        id:
          type: string
        library:
          type: string
        name:
          type: string
        description:
          type: string
        keywords:
          type: string
        pinCount:
          type: [integer, "null"]
        extends:
          type: string
      required: [id, library, name, description, keywords, pinCount]
      additionalProperties: false
    CircuitSymbolSearchResponse:
      type: object
      properties:
        sourceVersion:
          type: string
        total:
          type: integer
        hasMore:
          type: boolean
        libraries:
          type: array
          items:
            type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/CircuitSymbolSearchItem"
      required: [sourceVersion, total, hasMore, libraries, results]
      additionalProperties: false
    CircuitReviewRequest:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/CircuitSpec"
      required: [spec]
      additionalProperties: false
    CircuitReviewResponse:
      type: object
      properties:
        review:
          type: string
      required: [review]
      additionalProperties: false
    AiUsage:
      type: object
      properties:
        tokensUsed:
          type: integer
          minimum: 0
        tokensReserved:
          type: integer
          minimum: 0
        activeKeyNumber:
          type: integer
          minimum: 1
        configuredKeyNumbers:
          type: array
          items:
            type: integer
            minimum: 1
        canUseAi:
          type: boolean
      required:
        - tokensUsed
        - tokensReserved
        - activeKeyNumber
        - configuredKeyNumbers
        - canUseAi
      additionalProperties: false
    AiStatus:
      type: object
      properties:
        available:
          type: boolean
        canUseAi:
          type: boolean
        latencyMs:
          type: integer
          minimum: 0
        checkedAt:
          type: string
          format: date-time
      required: [available, canUseAi, latencyMs, checkedAt]
      additionalProperties: false
    AiKeySelectionRequest:
      type: object
      properties:
        keyNumber:
          type: integer
          minimum: 1
      required: [keyNumber]
      additionalProperties: false
    CircuitPoint:
      type: array
      items:
        type: number
      minItems: 2
      maxItems: 2
    KicadSymbolGraphic:
      type: object
      properties:
        type:
          type: string
          enum: [polyline, rectangle, circle, arc, bezier, text]
        points:
          type: array
          items:
            $ref: "#/components/schemas/CircuitPoint"
        radius:
          type: number
          minimum: 0
        text:
          type: string
        fontSize:
          type: number
          minimum: 0
        strokeWidth:
          type: number
          minimum: 0
        fillType:
          type: string
          enum: [none, background, outline]
        closed:
          type: boolean
      required: [type]
      additionalProperties: false
    KicadSymbolPin:
      type: object
      properties:
        number:
          type: string
        name:
          type: string
        electricalType:
          type: string
        shape:
          type: string
        point:
          $ref: "#/components/schemas/CircuitPoint"
        bodyPoint:
          $ref: "#/components/schemas/CircuitPoint"
        showName:
          type: boolean
        showNumber:
          type: boolean
      required: [number, name, electricalType, shape, point, bodyPoint, showName, showNumber]
      additionalProperties: false
    KicadSymbolUnit:
      type: object
      properties:
        unit:
          type: integer
          minimum: 1
        bodyStyle:
          type: integer
          minimum: 1
        pins:
          type: array
          maxItems: 512
          items:
            $ref: "#/components/schemas/KicadSymbolPin"
        graphics:
          type: array
          maxItems: 2048
          items:
            $ref: "#/components/schemas/KicadSymbolGraphic"
      required: [unit, bodyStyle, pins, graphics]
      additionalProperties: false
    KicadSymbolData:
      type: object
      properties:
        id:
          type: string
        units:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/KicadSymbolUnit"
      required: [id, units]
      additionalProperties: false
    CircuitElement:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        label:
          type: string
        value:
          type: string
        from:
          $ref: "#/components/schemas/CircuitPoint"
        to:
          $ref: "#/components/schemas/CircuitPoint"
        at:
          $ref: "#/components/schemas/CircuitPoint"
        symbolId:
          type: string
          pattern: "^[^:\\s]+:[^:\\s]+$"
        unit:
          type: integer
          minimum: 1
        bodyStyle:
          type: integer
          minimum: 1
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
        symbolData:
          $ref: "#/components/schemas/KicadSymbolData"
        points:
          type: array
          items:
            $ref: "#/components/schemas/CircuitPoint"
        x:
          type: number
        y:
          type: number
        w:
          type: number
        h:
          type: number
        height:
          type: number
        open:
          type: boolean
        closed:
          type: boolean
        flip:
          type: boolean
        circle:
          type: boolean
        swap:
          type: boolean
        style:
          type: string
        labelPos:
          type: string
        labelNudge:
          $ref: "#/components/schemas/CircuitPoint"
        labelAt:
          $ref: "#/components/schemas/CircuitPoint"
        labelAnchor:
          type: string
        text:
          type: string
        anchor:
          type: string
        size:
          type: number
        bold:
          type: boolean
        muted:
          type: boolean
      required:
        - type
      additionalProperties: true
    CircuitSpec:
      type: object
      properties:
        title:
          type: string
        width:
          type: number
        height:
          type: number
        elements:
          type: array
          items:
            $ref: "#/components/schemas/CircuitElement"
      required:
        - title
        - elements
      additionalProperties: true

