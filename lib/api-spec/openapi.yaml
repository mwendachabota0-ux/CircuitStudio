openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: circuits
    description: Circuit schematic generation
  - name: tutor
    description: Signed-in AI circuit education and review
  - name: account
    description: Per-account AI usage, memory, and key selection
  - name: v2-circuit-documents
    description: Staged V2 electrical circuit proposals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /circuits/generate:
    post:
      operationId: generateCircuit
      tags: [circuits]
      summary: Generate an editable circuit schematic
      description: Converts a natural-language circuit description into a CircuitDraw-compatible schematic specification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitPrompt"
      responses:
        "200":
          description: Generated circuit schematic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitSpec"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Circuit generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/library/search:
    get:
      operationId: searchCircuitSymbols
      tags: [circuits]
      summary: Search the KiCad schematic symbol library
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: library
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: family
          in: query
          required: false
          schema:
            type: string
            enum:
              - Passives
              - Semiconductors
              - Power & protection
              - Connectors
              - Analog & signal
              - Digital & processors
              - Sensors
              - Control & timing
              - Audio & display
              - Communications & RF
              - Other
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Matching symbols from the official KiCad library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitSymbolSearchResponse"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/library/symbol-data:
    get:
      operationId: getCircuitSymbolData
      tags: [circuits]
      summary: Get source geometry for a KiCad symbol preview
      parameters:
        - name: symbolId
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 160
            pattern: "^[^:\\s]+:[^:\\s]+$"
      responses:
        "200":
          description: Exact symbol units, pins, and drawing primitives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KicadSymbolData"
        "400":
          description: Invalid symbol ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: KiCad source geometry is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/tutor:
    post:
      operationId: askCircuitTutor
      tags: [tutor]
      summary: Ask for an explanation of a circuit or image
      description: Returns educational guidance that separates visible evidence from inference. Optional edit proposals are validated CircuitSpecs and never applied automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorRequest"
      responses:
        "200":
          description: Tutor explanation and optional edit proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorResponse"
        "400":
          description: Invalid question, image, or circuit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Uploaded image exceeds the size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/build-chat:
    post:
      operationId: chatWithCircuitBuilder
      tags: [tutor]
      summary: Clarify circuit requirements or propose a circuit edit
      description: Maintains a concise design brief and, in Build mode, may return a validated CircuitSpec proposal that the user must review and apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuildChatInput"
      responses:
        "200":
          description: Chat response, updated design brief, and optional circuit proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuildChatResponse"
        "400":
          description: Invalid chat message, brief, or circuit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The model response could not be used
          headers:
            X-Circuit-AI-Output-Invalid:
              description: Set to true when the response failed format or schema validation
              schema:
                type: string
                enum: ["true"]
            X-Circuit-AI-Retryable:
              description: Whether the client may retry this request
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is unavailable or usage could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/external-fix/review:
    post:
      operationId: reviewExternalCircuitFix
      tags: [tutor]
      summary: Review a user-pasted correction to a rejected circuit
      description: Checks a candidate CircuitSpec against a rejected proposal and its reported problems. The response is an AI review, not proof of electrical correctness or safety.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalCircuitFixReviewInput"
      responses:
        "200":
          description: AI review verdict and reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCircuitFixReviewResponse"
        "400":
          description: Invalid or unsupported candidate CircuitSpec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Review rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Studio AI could not produce a usable review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI usage could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/memories:
    get:
      operationId: listCircuitBuilderMemories
      tags: [account]
      summary: List saved Circuit Studio assumptions
      responses:
        "200":
          description: Saved assumptions for the signed-in user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircuitBuilderMemory"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearCircuitBuilderMemories
      tags: [account]
      summary: Delete all saved Circuit Studio assumptions
      responses:
        "204":
          description: All saved assumptions were deleted
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/memories/import:
    post:
      operationId: learnFromCircuitBuilderHistory
      tags: [account]
      summary: Learn reusable assumptions from saved chats
      description: Analyzes short summaries of recent local conversations and stores only reusable assumptions, not transcripts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuilderHistoryImportInput"
      responses:
        "200":
          description: Reusable assumptions extracted from the submitted history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuilderHistoryImportResponse"
        "400":
          description: Invalid history summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The AI could not summarize the saved chats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI usage could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/memories/repair-lessons:
    post:
      operationId: saveCircuitBuilderRepairLesson
      tags: [account]
      summary: Save a lesson from a corrected circuit
      description: Stores a repair lesson after a corrected proposal passes checks and the user applies it, or learns from a manual correction after it passes checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuilderRepairLessonInput"
      responses:
        "200":
          description: Repair lesson saved, already known, or not generalizable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuilderRepairLessonResult"
        "400":
          description: Invalid repair lesson or circuit evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Repair lesson generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: A reusable repair lesson could not be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Repair lesson could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/memories/feedback:
    post:
      operationId: saveCircuitBuilderFeedback
      tags: [account]
      summary: Save feedback on a Circuit Studio proposal
      description: Saves concise, account-owned feedback that can guide future similar circuit requests. The user can edit or remove it with saved memories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuilderFeedbackInput"
      responses:
        "200":
          description: Feedback was saved or was already present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuilderFeedbackResponse"
        "400":
          description: Invalid feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Feedback rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Feedback could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-documents/v2/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/CircuitDocumentV2SessionId"
    get:
      operationId: loadCircuitDocumentV2Draft
      tags: [account]
      summary: Load a signed-in user's V2 circuit document
      description: Reads only the V2 draft owned by the authenticated user and session. An empty result does not read or import legacy history.
      responses:
        "200":
          description: Loaded V2 draft or an explicit empty result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CircuitDocumentV2DraftLoadedResponse"
                  - $ref: "#/components/schemas/CircuitDocumentV2DraftEmptyResponse"
        "400":
          description: Invalid session identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2DraftError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2DraftError"
        "422":
          description: Stored V2 data is unsupported or quarantined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2DraftError"
        "503":
          description: V2 storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2DraftError"
    put:
      operationId: saveCircuitDocumentV2Draft
      tags: [account]
      summary: Create or update a V2 circuit document
      description: Validates a tagged V2 envelope and atomically saves it only when expectedRevision matches the authenticated user's current record. Use expectedRevision 0 only to create a missing record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitDocumentV2DraftWriteInput"
      responses:
        "200":
          description: The draft was saved with its new storage revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2DraftSavedResponse"
        "400":
          description: Invalid session, revision, envelope, or document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2DraftError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2DraftError"
        "409":
          description: The expected storage revision is stale or the record already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2DraftError"
        "503":
          description: V2 storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2DraftError"
  /circuit-documents/v2/generate:
    post:
      operationId: generateCircuitDocumentV2
      tags: [v2-circuit-documents]
      summary: Generate a staged V2 electrical circuit proposal
      description: Converts a circuit description to V2 components and explicit pin-to-net states. The response has an empty drawing section and is not saved or applied. Structural validation does not establish electrical correctness, simulation, or safety.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitDocumentV2GenerationInput"
      responses:
        "200":
          description: Staged, structurally validated electrical proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2ElectricalGenerationResult"
        "400":
          description: Invalid generation prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The request is outside supported safe generation scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The model response was malformed or failed V2 validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitDocumentV2GenerationError"
        "503":
          description: Gemini or usage accounting is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/history:
    get:
      operationId: listCircuitBuilderHistory
      tags: [account]
      summary: List saved Circuit Studio conversations
      description: Returns the signed-in user's complete chat and build history.
      responses:
        "200":
          description: Saved conversations and circuit snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircuitBuilderHistorySession"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: syncCircuitBuilderHistory
      tags: [account]
      summary: Save Circuit Studio conversations
      description: Saves or updates account-owned sessions, including unfinished chats and circuit snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuilderHistorySyncInput"
      responses:
        "200":
          description: Number of saved conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuilderHistorySyncResponse"
        "400":
          description: Invalid conversation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/history/deletions:
    get:
      operationId: listDeletedCircuitBuilderHistory
      tags: [account]
      summary: List deleted Circuit Studio conversations
      description: Returns account-owned conversation deletion markers so older device copies cannot restore deleted sessions.
      responses:
        "200":
          description: Deleted conversation identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircuitBuilderHistoryDeletion"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/history/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    delete:
      operationId: deleteCircuitBuilderHistory
      tags: [account]
      summary: Delete a saved Circuit Studio conversation
      description: Deletes one conversation owned by the signed-in user.
      responses:
        "204":
          description: Conversation deleted, or no matching conversation exists
        "400":
          description: Invalid conversation identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuit-builder/memories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateCircuitBuilderMemory
      tags: [account]
      summary: Edit a saved Circuit Studio assumption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuilderMemoryInput"
      responses:
        "200":
          description: Updated saved assumption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuilderMemory"
        "400":
          description: Invalid assumption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Assumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCircuitBuilderMemory
      tags: [account]
      summary: Delete a saved Circuit Studio assumption
      responses:
        "204":
          description: Assumption was deleted
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Assumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/review:
    post:
      operationId: reviewCircuit
      tags: [tutor]
      summary: Review a valid circuit draft
      description: Returns a concise educational review of a structurally valid draft. It does not check electrical safety or correctness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitReviewRequest"
      responses:
        "200":
          description: Review of the submitted draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitReviewResponse"
        "400":
          description: Invalid circuit draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/proposal-review:
    post:
      operationId: reviewCircuitProposal
      tags: [tutor]
      summary: Review a staged circuit proposal for intent and readability
      description: Returns advisory concerns about request fit and schematic readability. It does not verify electrical behavior, correctness, ratings, or safety, and never overrides deterministic blocking checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitProposalReviewInput"
      responses:
        "200":
          description: Advisory review of the staged proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitProposalReview"
        "400":
          description: Invalid circuit proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Review rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Studio AI could not produce a usable review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI usage could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/usage:
    get:
      operationId: getAiUsage
      tags: [account]
      summary: Read the signed-in account's AI usage and selected key
      responses:
        "200":
          description: Tracked usage and configured key numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsage"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [account]
      summary: Check Gemini model availability without generating content
      responses:
        "200":
          description: Provider responsiveness and account availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI status could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/key-selection:
    put:
      operationId: setAiKeySelection
      tags: [account]
      summary: Select a configured Gemini key for this account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiKeySelectionRequest"
      responses:
        "200":
          description: Updated account usage and selected key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsage"
        "400":
          description: The requested key number is not configured
          content:
            application/json:
              schema:
