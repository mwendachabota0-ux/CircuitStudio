kind = "web"
previewPath = "/"
title = "Circuit Solver"
description = "An interactive browser-based DC circuit solver for students and engineers. Enter circuit elements, inspect a circuit diagram, and calculate node voltages, branch currents, element power, Thevenin/Norton equivalents, and maximum power transfer."
version = "1.0.0"
id = "artifacts/circuit-solver"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22076

[services.development]
run = "pnpm --filter @workspace/circuit-solver run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/circuit-solver", "run", "build" ]
serve = "static"
publicDir = "artifacts/circuit-solver/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22076"
BASE_PATH = "/"
