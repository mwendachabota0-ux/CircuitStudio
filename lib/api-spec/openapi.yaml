openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: circuits
    description: Circuit schematic generation
  - name: tutor
    description: Signed-in AI circuit education and review
  - name: account
    description: Per-account AI usage and key selection
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /circuits/generate:
    post:
      operationId: generateCircuit
      tags: [circuits]
      summary: Generate an editable circuit schematic
      description: Converts a natural-language circuit description into a CircuitDraw-compatible schematic specification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitPrompt"
      responses:
        "200":
          description: Generated circuit schematic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitSpec"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Generation rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Circuit generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/tutor:
    post:
      operationId: askCircuitTutor
      tags: [tutor]
      summary: Ask for an explanation of a circuit or image
      description: Returns educational guidance that separates visible evidence from inference. Optional edit proposals are validated CircuitSpecs and never applied automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorRequest"
      responses:
        "200":
          description: Tutor explanation and optional edit proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorResponse"
        "400":
          description: Invalid question, image, or circuit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Uploaded image exceeds the size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/build-chat:
    post:
      operationId: chatWithCircuitBuilder
      tags: [tutor]
      summary: Clarify circuit requirements or propose a circuit edit
      description: Maintains a concise design brief and, in Build mode, may return a validated CircuitSpec proposal that the user must review and apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitBuildChatInput"
      responses:
        "200":
          description: Chat response, updated design brief, and optional circuit proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBuildChatResponse"
        "400":
          description: Invalid chat message, brief, or circuit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is unavailable or usage could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /circuits/review:
    post:
      operationId: reviewCircuit
      tags: [tutor]
      summary: Review a valid circuit draft
      description: Returns a concise educational review of a structurally valid draft. It does not check electrical safety or correctness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircuitReviewRequest"
      responses:
        "200":
          description: Review of the submitted draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitReviewResponse"
        "400":
          description: Invalid circuit draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/usage:
    get:
      operationId: getAiUsage
      tags: [account]
      summary: Read the signed-in account's AI usage and selected key
      responses:
        "200":
          description: Tracked usage and configured key numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsage"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [account]
      summary: Check Gemini model availability without generating content
      responses:
        "200":
          description: Provider responsiveness and account availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI status could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ai/key-selection:
    put:
      operationId: setAiKeySelection
      tags: [account]
      summary: Select a configured Gemini key for this account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiKeySelectionRequest"
      responses:
        "200":
          description: Updated account usage and selected key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsage"
        "400":
          description: The requested key number is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CircuitPrompt:
      type: object
      properties:
        prompt:
          type: string
          minLength: 8
          maxLength: 3000
      required:
        - prompt
    TutorImage:
      type: object
      properties:
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        dataBase64:
          type: string
          maxLength: 5592408
          description: Base64-encoded image bytes, without a data URL prefix. Maximum decoded size is 4 MiB.
      required: [mimeType, dataBase64]
      additionalProperties: false
    TutorRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 3000
        image:
          $ref: "#/components/schemas/TutorImage"
        currentSpec:
          $ref: "#/components/schemas/CircuitSpec"
        proposeEdits:
          type: boolean
          default: false
      additionalProperties: false
    TutorProposedEdit:
      type: object
      properties:
        summary:
          type: string
        spec:
          $ref: "#/components/schemas/CircuitSpec"
      required: [summary, spec]
      additionalProperties: false
    TutorResponse:
      type: object
      properties:
        answer:
          type: string
        observed:
          type: array
          items: { type: string }
        inferred:
          type: array
          items: { type: string }
        unknowns:
          type: array
          items: { type: string }
        missingValues:
          type: array
          items: { type: string }
        proposedEdit:
          $ref: "#/components/schemas/TutorProposedEdit"
      required: [answer, observed, inferred, unknowns, missingValues]
      additionalProperties: false
    CircuitBuildChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 3000
      required: [role, content]
      additionalProperties: false
    CircuitDesignBrief:
      type: object
      properties:
        goal:
          type: string
          maxLength: 1000
        requirements:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 300
        assumptions:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 300
        openQuestions:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 300
      required: [goal, requirements, assumptions, openQuestions]
      additionalProperties: false
    CircuitBuildChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 3000
        mode:
          type: string
          enum: [chat, build]
        currentSpec:
          $ref: "#/components/schemas/CircuitSpec"
        history:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/CircuitBuildChatMessage"
        brief:
          $ref: "#/components/schemas/CircuitDesignBrief"
      required: [message, mode, currentSpec]
      additionalProperties: false
    CircuitBuildProposal:
      type: object
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 500
        spec:
          $ref: "#/components/schemas/CircuitSpec"
      required: [summary, spec]
      additionalProperties: false
    CircuitBuildChatResponse:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 3000
        brief:
          $ref: "#/components/schemas/CircuitDesignBrief"
        proposal:
          $ref: "#/components/schemas/CircuitBuildProposal"
      required: [answer, brief]
      additionalProperties: false
    CircuitReviewRequest:
      type: object
      properties:
        spec:
          $ref: "#/components/schemas/CircuitSpec"
      required: [spec]
      additionalProperties: false
    CircuitReviewResponse:
      type: object
      properties:
        review:
          type: string
      required: [review]
      additionalProperties: false
    AiUsage:
      type: object
      properties:
        tokensUsed:
          type: integer
          minimum: 0
        tokensReserved:
          type: integer
          minimum: 0
        activeKeyNumber:
          type: integer
          minimum: 1
        configuredKeyNumbers:
          type: array
          items:
            type: integer
            minimum: 1
        canUseAi:
          type: boolean
      required:
        - tokensUsed
        - tokensReserved
        - activeKeyNumber
        - configuredKeyNumbers
        - canUseAi
      additionalProperties: false
    AiStatus:
      type: object
      properties:
        available:
          type: boolean
        canUseAi:
          type: boolean
        latencyMs:
          type: integer
          minimum: 0
        checkedAt:
          type: string
          format: date-time
      required: [available, canUseAi, latencyMs, checkedAt]
      additionalProperties: false
    AiKeySelectionRequest:
      type: object
      properties:
        keyNumber:
          type: integer
          minimum: 1
      required: [keyNumber]
      additionalProperties: false
    CircuitPoint:
      type: array
      items:
        type: number
      minItems: 2
      maxItems: 2
    CircuitElement:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        label:
          type: string
        value:
          type: string
        from:
          $ref: "#/components/schemas/CircuitPoint"
        to:
          $ref: "#/components/schemas/CircuitPoint"
        at:
          $ref: "#/components/schemas/CircuitPoint"
        points:
          type: array
          items:
            $ref: "#/components/schemas/CircuitPoint"
        x:
          type: number
        y:
          type: number
        w:
          type: number
        h:
          type: number
        height:
          type: number
        open:
          type: boolean
        closed:
          type: boolean
        flip:
          type: boolean
        circle:
          type: boolean
        swap:
          type: boolean
        style:
          type: string
        labelPos:
          type: string
        labelNudge:
          $ref: "#/components/schemas/CircuitPoint"
        labelAt:
          $ref: "#/components/schemas/CircuitPoint"
        labelAnchor:
          type: string
        text:
          type: string
        anchor:
          type: string
        size:
          type: number
        bold:
          type: boolean
        muted:
          type: boolean
      required:
        - type
      additionalProperties: true
    CircuitSpec:
      type: object
      properties:
        title:
          type: string
        width:
          type: number
        height:
          type: number
        elements:
          type: array
          items:
            $ref: "#/components/schemas/CircuitElement"
      required:
        - title
        - elements
      additionalProperties: true

